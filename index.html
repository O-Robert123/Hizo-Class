<body>
    <form action="" method="post">
        <div class="outer-container">
            <div class="inner-container">
                <h1 class="">Login</h1>
                <div class="username-box arrangement margin">
                    <label for="username">Username</label>
                    <input type="text" required>
                </div>
                <div class="password-box arrangement margin">
                    <label for="password">Password</label>
                    <input type="password" name="" id="password" required>
                </div>
                <div class="sumbit-box margin">
                    <button type="submit">Submit</button>
                    <div class="signup-text">
                        <p>Don't have an account? <a href="./Excercises/signup.html">Sign Up</a></p>
                    </div>
                    <div>
                        <p><a href="./Excercises/table.html">Table Required by Mr Victor</a></p>
                    </div>
                </div>
            </div>
        </div>
    </form>
