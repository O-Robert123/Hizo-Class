<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="./styles2.css">
</head>

<body>
    <form action="" method="post">
        <div class="outer-container">
            <div class="inner-container">
                <h1 class="">Sign Up</h1>
                <div class="username-box arrangement margin">
                    <label for="username">Username</label>
                    <input type="text" required>
                </div>
                <div class="password-box arrangement margin">
                    <label for="password">Password</label>
                    <input type="password" name="" id="password" required>
                </div>
                <div class="email-box arrangement margin">
                    <label for="email">Email Address</label>
                    <input type="email" name="" id="email" required>
                </div>
                <div class="phone-box arrangement margin">
                    <label for="phone-number">Phone Number</label>
                    <input type="tel" name="" id="telephone">
                </div>
                <div class="margin container">
                    <div class="arrangement DoB">
                        <label for="date">Date of Birth</label>
                        <input type="date" required>
                    </div>
                    <div class="arrangement Gender">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender-dropdown">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="sumbit-box margin">
                    <button type="submit">Submit</button>
                </div>
            </div>
    </form>
</body>

</html>
