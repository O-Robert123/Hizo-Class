<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        h1 {
            text-align: center;
        }

        table {
            width: 70%;
            border: none;
            text-align: left;
            margin: 50px auto;
            border-collapse: collapse; 
            border: 2px solid green;
        }

        thead {
            background-color: lightgray;
            border: 2px solid green;
            border-radius: 10px;
        }


        td,th {
            padding: 20px;
        }

        tbody>tr:hover {
            background-color: green;
            color: white;
        }
    </style>
</head>

<body>
